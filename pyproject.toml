[project]
name = "sentinelbench"
version = "0.2.0"
description = "Detection quality benchmarking for Microsoft Sentinel"
requires-python = ">=3.10"

[tool.ruff]
# Pinned in requirements-dev.txt; ruff's default rule set changes between
# releases, so the version and this config together define the lint gate.
target-version = "py310"
extend-exclude = ["dashboard/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
