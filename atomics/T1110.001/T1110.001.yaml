# SentinelBench custom atomic, in Atomic Red Team format.
#
# Why this exists: every upstream ART Windows test for T1110.001 targets
# Active Directory (SMB/LDAP against a domain, or Kerbrute). The v1 lab is a
# single standalone VM, so this test generates failed logons locally instead.
#
# It creates a throwaway local account, then calls the Windows LogonUser API
# directly with a logon type of 3 (network) and a wrong password, #{attempts}
# times, and finally deletes the account. Each failed call produces a Security
# event 4625 with LogonType 3 against a *real* account -- so Sentinel rules
# that only consider valid accounts (e.g. "Failed logon attempts by valid
# accounts within 10 mins") apply -- without any network connection,
# interactive prompt, or child process.
#
# An earlier version looped `net use` over loopback SMB; net.exe could block
# on a password prompt and spawn children, which hung a full suite run.
# LogonUser avoids that. A still-earlier LogonUser version targeted a
# non-existent user, which valid-account brute-force rules ignore; this one
# creates the account first.
#
# Requires the "Logon" audit subcategory to log failures (the lab
# provisioning enables it) and local admin (to create the account).
# Standalone Windows Server has no account-lockout policy by default, so the
# attempts do not lock the account; cleanup deletes it regardless.
attack_technique: T1110.001
display_name: 'Brute Force: Password Guessing'
atomic_tests:
- name: Local failed logons against a valid account via LogonUser (SentinelBench)
  auto_generated_guid: 2a0a08a4-1f45-4089-984d-656e7764f699
  description: |
    Creates a local account with a random strong password, calls LogonUser
    with a wrong password #{attempts} times against it (Security event 4625,
    type 3), then deletes the account. Self-contained: no network, no
    prompts, no child processes.
  supported_platforms:
  - windows
  input_arguments:
    username:
      description: Local account to create, target and delete
      type: string
      default: sb_brute_target
    attempts:
      description: Number of failed logon attempts
      type: integer
      default: 20
  executor:
    name: powershell
    elevation_required: true
    command: |
      $realpw = -join ((48..57) + (65..90) + (97..122) | Get-Random -Count 20 | ForEach-Object {[char]$_}) + '!aA9'
      net user "#{username}" "$realpw" /add | Out-Null
      $signature = @"
      using System;
      using System.Runtime.InteropServices;
      public static class SbLogon {
          [DllImport("advapi32.dll", SetLastError=true)]
          public static extern bool LogonUser(
              string user, string domain, string password,
              int logonType, int logonProvider, out IntPtr token);
      }
      "@
      Add-Type -TypeDefinition $signature -ErrorAction SilentlyContinue
      $LOGON32_LOGON_NETWORK = 3
      $LOGON32_PROVIDER_DEFAULT = 0
      $failures = 0
      for ($i = 1; $i -le #{attempts}; $i++) {
          $token = [IntPtr]::Zero
          $ok = [SbLogon]::LogonUser(
              "#{username}", $env:COMPUTERNAME, "WrongGuess_$i!",
              $LOGON32_LOGON_NETWORK, $LOGON32_PROVIDER_DEFAULT, [ref]$token)
          if (-not $ok) { $failures++ }
      }
      Write-Host "Generated $failures failed logon attempts for valid account #{username}"
    cleanup_command: |
      net user "#{username}" /delete 2>&1 | Out-Null
