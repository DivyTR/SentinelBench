# SentinelBench custom atomic, in Atomic Red Team format.
#
# Why this exists: every upstream ART Windows test for T1110.001 targets
# Active Directory (SMB/LDAP against a domain, or Kerbrute). The v1 lab is a
# single standalone VM, so this test generates failed logons locally instead.
#
# It calls the Windows LogonUser API directly with a logon type of 3 (network)
# and a wrong password, #{attempts} times. Each failed call produces a
# Security event 4625 with LogonType 3 -- exactly what a failed-logon
# brute-force rule keys on -- without any network connection, any interactive
# prompt, or any child process. The target account does not need to exist;
# an unknown user still generates 4625.
#
# An earlier version used a `net use` loop over loopback SMB. net.exe could
# block on an interactive password prompt and spawn child processes, which
# hung the first full suite run. LogonUser avoids all of that.
#
# Requires the "Logon" audit subcategory to log failures
# (auditpol /set /subcategory:"Logon" /failure:enable), which the lab
# provisioning enables.
attack_technique: T1110.001
display_name: 'Brute Force: Password Guessing'
atomic_tests:
- name: Local failed logons via LogonUser (SentinelBench)
  auto_generated_guid: 2a0a08a4-1f45-4089-984d-656e7764f699
  description: |
    Calls LogonUser with a wrong password #{attempts} times against a local
    account name, generating Security event 4625 (failed logon, type 3).
    Self-contained: no network, no prompts, no child processes, nothing to
    clean up.
  supported_platforms:
  - windows
  input_arguments:
    username:
      description: Local account name to target (need not exist)
      type: string
      default: sb_brute_target
    attempts:
      description: Number of failed logon attempts
      type: integer
      default: 20
  executor:
    name: powershell
    elevation_required: false
    command: |
      $signature = @"
      using System;
      using System.Runtime.InteropServices;
      public static class SbLogon {
          [DllImport("advapi32.dll", SetLastError=true)]
          public static extern bool LogonUser(
              string user, string domain, string password,
              int logonType, int logonProvider, out IntPtr token);
      }
      "@
      Add-Type -TypeDefinition $signature -ErrorAction SilentlyContinue
      $LOGON32_LOGON_NETWORK = 3
      $LOGON32_PROVIDER_DEFAULT = 0
      $failures = 0
      for ($i = 1; $i -le #{attempts}; $i++) {
          $token = [IntPtr]::Zero
          $ok = [SbLogon]::LogonUser(
              "#{username}", $env:COMPUTERNAME, "WrongGuess_$i!",
              $LOGON32_LOGON_NETWORK, $LOGON32_PROVIDER_DEFAULT, [ref]$token)
          if (-not $ok) { $failures++ }
      }
      Write-Host "Generated $failures failed logon attempts for #{username}"
